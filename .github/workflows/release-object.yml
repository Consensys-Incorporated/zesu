name: Release rv64im Objects

# Builds the relocatable rv64im guest ELF artifact — the zkvm-standards
# baseline (zesu.rv64im.o) — and opens a draft GitHub Release so it can be
# consumed by zesu-zkvm targets without a source dependency. The ZisK guest
# builds zesu itself, through addGuestObject.
#
# Trigger manually from Actions → "Release rv64im Objects" → Run workflow.
# Provide the version tag (e.g. v0.2.0); the release is created as a draft so
# it can be reviewed and published manually.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

permissions: {} # lock everything by default (least-privilege)

jobs:
  build-and-release:
    name: Build guest object and create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # least-privilege for this job only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: "0.16.0"
          # A release downloads Zig instead of restoring it from the Actions cache.
          cache: false

      - name: Build rv64im relocatable object
        run: zig build rv64im-object -Doptimize=ReleaseFast

      - name: Stage artifacts
        run: |
          mkdir -p output
          cp zig-out/lib/zesu.o output/zesu.rv64im.o

      - name: Verify artifacts
        run: |
          file output/zesu.rv64im.o
          nm output/zesu.rv64im.o | grep " U " | sort || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rv64im-objects
          path: output/zesu.rv64im.o
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --draft \
            output/zesu.rv64im.o
