name: Release rv64im Objects

# Builds the relocatable rv64im guest ELF artifacts — the zkvm-standards
# baseline (zesu.rv64im.o) and the ZisK variant with Zbb/Zbs added
# (zesu.zisk.o, see PRs #117, #119) — and opens a draft GitHub Release so
# either can be consumed by zesu-zkvm targets without a source dependency.
#
# Trigger manually from Actions → "Release rv64im Objects" → Run workflow.
# Provide the version tag (e.g. v0.2.0); the release is created as a draft so
# it can be reviewed and published manually.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build guest objects and create draft release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: "0.16.0"

      - name: Build rv64im relocatable object
        run: zig build rv64im-object -Doptimize=ReleaseFast

      - name: Build zisk relocatable object (rv64im + Zbb + Zbs)
        run: zig build zisk-object -Doptimize=ReleaseFast

      - name: Stage artifacts
        run: |
          mkdir -p output
          cp zig-out/lib/zesu.o output/zesu.rv64im.o
          cp zig-out/lib/zesu-zisk.o output/zesu.zisk.o

      - name: Verify artifacts
        run: |
          for f in output/zesu.rv64im.o output/zesu.zisk.o; do
            file "$f"
            nm "$f" | grep " U " | sort || true
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rv64im-objects
          path: |
            output/zesu.rv64im.o
            output/zesu.zisk.o
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --draft \
            output/zesu.rv64im.o \
            output/zesu.zisk.o
