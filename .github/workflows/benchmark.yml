# On-demand guest benchmark. Comment `/benchmark` on a PR (optionally
# `/benchmark 20` for a block count) and this builds the guest ELF at the PR
# head and at its merge-base, runs both over the same devnet-8 blocks, and
# posts the per-chip cost delta.
#
# Worth doing here because ZisK trace costs are deterministic: the same ELF on
# the same input always bills the same cells, so a 0.05% move is real signal
# rather than runner variance. Most CI perf jobs cannot make that claim.
#
# On demand rather than per-push for three reasons: `issue_comment` runs with a
# write token from the default branch (so posting works from forks with no
# `pull_request_target` gymnastics), nobody is blocked waiting on it, and
# numbers posted automatically on every push get ignored within a week.
name: Benchmark

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to benchmark"
        required: true
        type: string
      blocks:
        description: "Number of devnet-8 blocks (rounded up to whole 10-block batches)"
        required: false
        default: "10"
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: benchmark-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

env:
  CORPUS: glamsterdam-devnet-8
  CORPUS_URL: https://pub-760ad8b3dd9547539f829c1ea30f18b5.r2.dev/devnets/glamsterdam-devnet-8
  # Pinned so runs stay comparable over time. The corpus is append-only, but
  # "the newest N blocks" would silently change what is being measured.
  CORPUS_START: "93350"
  # Benchmark harness (public). Its `bench-eest-fixtures` branch walks fixture
  # trees recursively and reports per-chip costs; `main` misparses these
  # fixtures as empty blocks.
  SE_REPO: Gabriel-Trintinalia/stateless-executor
  SE_REF: "7ce7770c2ce41c9439237e73fc980fed615d7fb1"

jobs:
  bench:
    name: Guest benchmark
    # The author-association gate is required, not optional: this checks out
    # and runs PR code with a writable token.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/benchmark') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Acknowledge the request
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes --silent || true

      - name: Resolve request
        id: req
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pr="${{ inputs.pr }}"; blocks="${{ inputs.blocks }}"
          else
            pr="${{ github.event.issue.number }}"
            # `/benchmark 20` -> 20; bare `/benchmark` -> default.
            blocks=$(printf '%s' "${{ github.event.comment.body }}" \
              | head -1 | grep -oE '[0-9]+' | head -1 || true)
          fi
          blocks="${blocks:-10}"
          # Clamp: each block is ~7.5G trace cells and runs twice.
          if [ "$blocks" -gt 50 ]; then blocks=50; fi
          if [ "$blocks" -lt 1 ]; then blocks=10; fi
          echo "pr=$pr"           >> "$GITHUB_OUTPUT"
          echo "blocks=$blocks"   >> "$GITHUB_OUTPUT"
          echo "PR #$pr, $blocks block(s)"

      - name: Checkout zesu (PR head)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: head
          fetch-depth: 0

      - name: Check out the PR and find its merge-base
        id: shas
        working-directory: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checkout "${{ steps.req.outputs.pr }}"
          head_sha=$(git rev-parse HEAD)
          git fetch -q origin main
          base_sha=$(git merge-base origin/main HEAD)
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head $head_sha"
          echo "base $base_sha"
          # Read the zesu-zkvm pin from the PR's own CI config, so the guest is
          # linked exactly the way CI links it.
          ref=$(grep -m1 'ZKVM_REF:' .github/workflows/ci.yml | sed 's/.*"\(.*\)".*/\1/')
          test -n "$ref"
          echo "zkvm=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout zesu (merge-base)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: base
          ref: ${{ steps.shas.outputs.base }}

      # The reporting script comes from the default branch, never from the PR:
      # otherwise a PR could rewrite the script that renders its own verdict.
      - name: Checkout reporting script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: trusted

      - name: Checkout zesu-zkvm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Consensys-Incorporated/zesu-zkvm
          ref: ${{ steps.shas.outputs.zkvm }}
          path: zesu-zkvm

      - name: Checkout benchmark harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ env.SE_REPO }}
          ref: ${{ env.SE_REF }}
          path: harness

      - name: Resolve the ZisK version zesu-zkvm builds against
        id: zisk
        run: |
          v=$(grep -m1 'ZISK_VERSION:' zesu-zkvm/.github/workflows/ci.yml | sed 's/.*"\(.*\)".*/\1/')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ZisK $v"

      - name: Checkout zisk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: 0xPolygonHermez/zisk
          ref: v${{ steps.zisk.outputs.version }}
          path: zisk

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: '0.16.0'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-zisk runtime deps
        run: sudo apt-get install -y libomp5 libopenmpi3t64

      - name: Install cargo-zisk
        run: |
          ZISK_BIN_DIR="${HOME}/.config/.zisk/bin"
          mkdir -p "$ZISK_BIN_DIR"
          curl -fsSL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup" \
            -o "$ZISK_BIN_DIR/ziskup"
          chmod +x "$ZISK_BIN_DIR/ziskup"
          # Pin the emulator to the same ZisK as the staticlib and linker script;
          # bare `ziskup` resolves "latest" and can silently outrun them.
          "$ZISK_BIN_DIR/ziskup" -v "${{ steps.zisk.outputs.version }}" --cpu --nokey
          echo "$ZISK_BIN_DIR" >> $GITHUB_PATH
          "$ZISK_BIN_DIR/ziskemu" --version

      - name: Install Zisk Rust toolchain
        run: cargo +zisk --version 2>/dev/null || cargo-zisk toolchain install

      - name: Cache libziskos_staticlib.a
        id: cache-libziskos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zesu-zkvm/zisk/lib/libziskos_staticlib.a
          key: libziskos-staticlib-${{ steps.zisk.outputs.version }}-${{ runner.os }}

      - name: Build libziskos_staticlib.a
        if: steps.cache-libziskos.outputs.cache-hit != 'true'
        working-directory: zesu-zkvm/zisk
        run: make lib/libziskos_staticlib.a ZISK_DIR=$GITHUB_WORKSPACE/zisk

      # The merge-base ELF is identical for every PR sharing that base, so it is
      # usually a cache hit and only the PR head gets built. The key covers
      # everything that would make the two builds incomparable — base commit,
      # ZisK version, linker/host pin — so a stale hit cannot skew a comparison.
      - name: Cache merge-base ELF
        id: cache-base-elf
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: elf-base
          key: >-
            benchelf-${{ steps.shas.outputs.base }}-${{ steps.zisk.outputs.version }}-${{
            steps.shas.outputs.zkvm }}-${{ runner.os }}

      - name: Build merge-base ELF
        if: steps.cache-base-elf.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          (cd base && zig build rv64im-object -Doptimize=ReleaseFast)
          (cd zesu-zkvm/zisk && zig build -Doptimize=ReleaseFast \
            -Dzesu_obj="$GITHUB_WORKSPACE/base/zig-out/lib/zesu.o")
          cp zesu-zkvm/zisk/zig-out/bin/zesu-zisk elf-base

      - name: Build PR head ELF
        run: |
          set -euo pipefail
          (cd head && zig build rv64im-object -Doptimize=ReleaseFast)
          # Remove the previous link output: a failed build otherwise leaves a
          # stale ELF behind and the benchmark silently measures the old one.
          rm -f zesu-zkvm/zisk/zig-out/bin/zesu-zisk
          (cd zesu-zkvm/zisk && zig build -Doptimize=ReleaseFast \
            -Dzesu_obj="$GITHUB_WORKSPACE/head/zig-out/lib/zesu.o")
          cp zesu-zkvm/zisk/zig-out/bin/zesu-zisk elf-head
          ls -l elf-base elf-head

      - name: Fetch corpus blocks
        run: |
          set -euo pipefail
          blocks="${{ steps.req.outputs.blocks }}"
          batches=$(( (blocks + 9) / 10 ))
          curl -fsSL "$CORPUS_URL/batches.jsonl" -o batches.jsonl
          mkdir -p corpus
          python3 - "$batches" <<'PY' > wanted.txt
          import json, os, sys
          want, start = int(sys.argv[1]), int(os.environ["CORPUS_START"])
          rows = [json.loads(l) for l in open("batches.jsonl") if l.strip()]
          rows = [r for r in rows if r["batchStartBlock"] >= start]
          rows.sort(key=lambda r: r["batchStartBlock"])
          for r in rows[:want]:
              print(r["path"], r["sha256"][2:])
          PY
          test -s wanted.txt
          while read -r path sha; do
            f="corpus/$(basename "$path")"
            curl -fsSL "$CORPUS_URL/$path" -o "$f"
            echo "$sha  $f" | sha256sum -c -
            tar --zstd -xf "$f" -C corpus
          done < wanted.txt
          # Point the harness at blockchain_tests/, not the corpus root: the
          # archives also carry .meta/manifest.json, which is not a fixture.
          find corpus/blockchain_tests -name '*.json' | wc -l

      - name: Build the harness
        working-directory: harness
        run: go build -o "$GITHUB_WORKSPACE/bench" ./bench

      - name: Run benchmark
        run: |
          set -euo pipefail
          for v in base head; do
            ./bench \
              --fixtures corpus/blockchain_tests \
              --elf "elf-$v" \
              --zkvmPath ziskemu \
              --jobs "$(nproc)" \
              --csv "$v.csv"
          done

      # Detail pass: one extra execution per variant (~10s each) buys the
      # per-opcode, FROPS, memory-by-type and per-function tables. `--save-stats`
      # then lets ziskemu diff the two snapshots itself, with no further run.
      # Uses the in-repo vector, which needs no SSZ encoding — so it says what
      # moved, while the corpus above says how much.
      - name: Detail pass
        id: detail
        continue-on-error: true
        run: |
          set -euo pipefail
          vector=$(find zesu-zkvm/vectors -name '*.bin' | sort | head -1)
          test -n "$vector"
          echo "label=$(basename "$vector" .bin)" >> "$GITHUB_OUTPUT"
          for v in base head; do
            ziskemu -e "elf-$v" -i "$vector" -X -S --mem-stats \
              --save-stats "snap-$v.csv" > "report-$v.txt"
          done
          ziskemu --diff-stats snap-base.csv snap-head.csv --color never > opcode-diff.txt
          ziskemu --diff-stats snap-base.csv snap-head.csv \
            --html-report bench-detail.html > /dev/null

      - name: Render comparison
        id: diff
        run: |
          set +e
          detail=""
          if [ -s report-base.txt ] && [ -s report-head.txt ]; then
            detail="--base-report report-base.txt --head-report report-head.txt"
            detail="$detail --detail-label ${{ steps.detail.outputs.label }}"
            [ -s opcode-diff.txt ] && detail="$detail --opcode-diff opcode-diff.txt"
          fi
          python3 trusted/.github/scripts/bench_diff.py \
            --base base.csv --head head.csv \
            --base-sha "${{ steps.shas.outputs.base }}" \
            --head-sha "${{ steps.shas.outputs.head }}" \
            --corpus "$CORPUS" $detail > comment.md
          echo "status=$?" >> "$GITHUB_OUTPUT"

          # The run summary has a 1 MB budget against the comment's 64 KB, so
          # the full reports go here in full — rendered on the run page, with
          # no artifact download.
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          for v in base head; do
            [ -s "report-$v.txt" ] || continue
            {
              printf '\n<details><summary>Full %s report</summary>\n\n```\n' "$v"
              cat "report-$v.txt"
              printf '```\n\n</details>\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Post result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- zesu-benchmark -->'
          printf '%s\n' "$marker" >> comment.md
          # Update in place so repeated runs don't bury the PR in comments.
          existing=$(gh api --paginate \
            "repos/${{ github.repository }}/issues/${{ steps.req.outputs.pr }}/comments" \
            --jq "[.[] | select(.body | contains(\"$marker\"))] | last | .id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@comment.md --silent
          else
            gh api -X POST \
              "repos/${{ github.repository }}/issues/${{ steps.req.outputs.pr }}/comments" \
              -F body=@comment.md --silent
          fi

      # The comment is a summary; these hold the full per-opcode, memory and
      # per-function tables for anyone digging into a surprising number.
      - name: Upload full reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ steps.req.outputs.pr }}-${{ steps.shas.outputs.head }}
          path: |
            base.csv
            head.csv
            report-base.txt
            report-head.txt
            snap-base.csv
            snap-head.csv
            opcode-diff.txt
            bench-detail.html
          if-no-files-found: warn

      # Perf movement never fails the run; a wrong payload root or a block that
      # did not execute does, so a broken PR cannot read as a clean benchmark.
      - name: Fail on correctness divergence
        if: steps.diff.outputs.status != '0'
        run: |
          echo "Benchmark found a correctness divergence — see the PR comment."
          exit 1
