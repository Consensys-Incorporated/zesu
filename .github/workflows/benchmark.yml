# On-demand guest benchmark. Comment `/benchmark` on a PR (optionally
# `/benchmark 20` for a block count) and this builds the guest ELF at the PR
# head and at its merge-base for each guest object variant (the zkvm-standards
# rv64im baseline, and the ZisK-specific rv64im+Zbb+Zbs build — see
# build.zig's `rv64im-object` / `zisk-object` steps), runs both over the same
# Sepolia blocks, and posts a separate per-chip cost delta comment for each
# variant. Each comment also carries a per-suite table for the 30M gas tier of
# tests-zkevm-benchmark, sampled to one measured block per fixture file.
#
# Worth doing here because ZisK trace costs are deterministic: the same ELF on
# the same input always bills the same cells, so a 0.05% move is real signal
# rather than runner variance. Most CI perf jobs cannot make that claim.
#
# On demand rather than per-push for three reasons: `issue_comment` runs with a
# write token from the default branch (so posting works from forks with no
# `pull_request_target` gymnastics), nobody is blocked waiting on it, and
# numbers posted automatically on every push get ignored within a week.
#
# A `/benchmark` comment only runs `trigger`, which re-dispatches this workflow:
# `issue_comment` runs can read the Actions cache but not write it, and the
# merge-base caches below are worth nothing unless they get saved.
#
# Jobs: (trigger ->) prepare -> (build per variant, inputs) -> run per variant x
# shard -> report per variant -> finish. The shards are the corpus plus TIER_SHARDS
# slices of the tier sample, so a bigger sample costs more runners rather than
# more minutes.
name: Benchmark

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to benchmark"
        required: true
        type: string
      blocks:
        description: "Number of Sepolia blocks (max 50)"
        required: false
        default: "10"
        type: string
      comment_id:
        description: "Comment to react to (set by /benchmark)"
        required: false
        default: ""
        type: string

# Write access is granted per job: only trigger and finish (the reactions and the
# dispatch) and report (the comment and label) get it. The jobs that build and run PR code
# stay read-only.
permissions:
  contents: read

# The trigger runs get a group of their own, so the run they dispatch never
# cancels them; a newer request still cancels an older run for the same PR.
concurrency:
  group: >-
    ${{ github.event_name == 'issue_comment'
        && format('benchmark-trigger-{0}', github.run_id)
        || format('benchmark-{0}', inputs.pr) }}
  cancel-in-progress: true

env:
  CORPUS: Sepolia
  CORPUS_URL: https://pub-afa6b160acfb4919bda1d0e2a00b5b77.r2.dev/testnets/sepolia
  # Pinned so runs stay comparable over time. The corpus is append-only, but
  # "the newest N blocks" would silently change what is being measured.
  CORPUS_START: "11856500"
  # Blocks per corpus batch: a run downloads whole batches and keeps the first N.
  CORPUS_BATCH_SIZE: "100"
  # Benchmark harness (public), at a commit that reads the corpus's
  # blockchain_test_engine fixtures (stateless-executor #21).
  SE_REPO: Gabriel-Trintinalia/stateless-executor
  SE_REF: "c8bdd98c390c04b25841fd2b442710e0dd7ef20b"
  # Gas tier from tests-zkevm-benchmark. The full tier is ~1200 gas-using
  # blocks at about a minute each, so bench_sample.py keeps the measured (last)
  # block of TIER_PER_FILE tests from each fixture file: 120 blocks at 1.
  TIER: 30M
  TIER_RELEASE: tests-zkevm-benchmark@v21.0.5
  TIER_DIR: for_amsterdam_at_0030M
  TIER_PER_FILE: "1"
  # Runners the tier sample is split across: ~6-7 blocks each keeps a shard
  # near the time of its slowest block. Raise it with TIER_PER_FILE.
  TIER_SHARDS: "18"

jobs:
  trigger:
    name: Trigger
    # The author-association gate is required, not optional: the dispatched run
    # checks out and builds PR code.
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/benchmark') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reacting to a comment on a PR needs pull-requests: write; issues: write
    # alone is refused with a 403. actions: write is for the dispatch.
    permissions:
      actions: write
      pull-requests: write
      issues: write
    steps:
      # `author_association` describes the commenter's relationship to the
      # *organisation*, not their access to this repo, so `MEMBER` admits
      # read-only org members. The run this dispatches builds PR code — and
      # `zig build` runs `build.zig` — so the requester must actually hold write
      # here. The `if:` above stays as a cheap pre-filter; this is the authority.
      - name: Verify the requester can write to this repo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)
          # The API reports the triage role as `read`, so triage is excluded too.
          case "$perm" in
            write|admin) echo "$ACTOR has '$perm'" ;;
            *) echo "::error::$ACTOR has '$perm' on $REPO; /benchmark requires write."
               exit 1 ;;
          esac

      - name: Acknowledge the request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST \
            "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes --silent || true

      # Every value below reaches bash through `env`, never through `${{ }}`
      # interpolation: the comment body is attacker-controlled text, and
      # substituting it into the script would let a quote or `$()` in a routine
      # `/benchmark` note execute as shell. prepare validates both values again.
      #
      # A dispatch made with GITHUB_TOKEN does start a new run: workflow_dispatch
      # is one of the two events exempt from that token's no-recursion rule.
      - name: Dispatch the benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # `/benchmark 20` -> 20; bare `/benchmark` -> prepare's default.
          blocks=$(printf '%s' "$COMMENT_BODY" \
            | head -1 | grep -oE '[0-9]+' | head -1 || true)
          gh workflow run benchmark.yml -R "$REPO" --ref "$REF" \
            -f pr="$PR" -f blocks="${blocks:-10}" -f comment_id="$COMMENT_ID"
          echo "Dispatched the benchmark for PR #$PR"

  prepare:
    name: Prepare
    # GitHub requires write access to start a workflow_dispatch run, and the
    # trigger job checks it before dispatching on a commenter's behalf.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.req.outputs.pr }}
      blocks: ${{ steps.req.outputs.blocks }}
      head: ${{ steps.shas.outputs.head }}
      base: ${{ steps.shas.outputs.base }}
      zkvm: ${{ steps.shas.outputs.zkvm }}
      zisk: ${{ steps.zisk.outputs.version }}
      sampler: ${{ steps.sampler.outputs.hash }}
      shards: ${{ steps.shards.outputs.list }}

    steps:
      # Inputs reach bash through `env`, never through `${{ }}` interpolation.
      - name: Resolve request
        id: req
        env:
          INPUT_PR: ${{ inputs.pr }}
          INPUT_BLOCKS: ${{ inputs.blocks }}
        run: |
          pr="$INPUT_PR"; blocks="$INPUT_BLOCKS"
          # Both are user-supplied, so accept digits only before the arithmetic
          # comparisons below, which would otherwise error out.
          case "$pr" in ''|*[!0-9]*) echo "bad PR number"; exit 1 ;; esac
          case "$blocks" in *[!0-9]*) blocks="" ;; esac
          blocks="${blocks:-10}"
          # Clamp: each block is ~7.5G trace cells and runs twice.
          if [ "$blocks" -gt 50 ]; then blocks=50; fi
          if [ "$blocks" -lt 1 ]; then blocks=10; fi
          echo "pr=$pr"           >> "$GITHUB_OUTPUT"
          echo "blocks=$blocks"   >> "$GITHUB_OUTPUT"
          echo "PR #$pr, $blocks block(s)"

      - name: Checkout zesu (PR head)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: head
          fetch-depth: 0

      - name: Check out the PR and find its merge-base
        id: shas
        working-directory: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.req.outputs.pr }}
        run: |
          gh pr checkout "$PR"
          head_sha=$(git rev-parse HEAD)
          # Against the PR's own base branch, not main: CI accepts PRs onto
          # `develop`, and stacked PRs target another perf branch. Using main
          # there would fold the whole base branch into the delta and could
          # raise a spurious payload-root caution.
          base_ref=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          test -n "$base_ref"
          git fetch -q origin "$base_ref"
          base_sha=$(git merge-base "origin/$base_ref" HEAD)
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head $head_sha"
          echo "base $base_sha (merge-base with $base_ref)"
          # Read the zesu-zkvm pin from the PR's own CI config, so the guest is
          # linked exactly the way CI links it.
          ref=$(grep -m1 'ZKVM_REF:' .github/workflows/ci.yml | sed 's/.*"\(.*\)".*/\1/')
          test -n "$ref"
          echo "zkvm=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout zesu-zkvm CI config
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Consensys-Incorporated/zesu-zkvm
          ref: ${{ steps.shas.outputs.zkvm }}
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false
          path: zesu-zkvm

      - name: Resolve the ZisK version zesu-zkvm builds against
        id: zisk
        run: |
          v=$(grep -m1 'ZISK_VERSION:' zesu-zkvm/.github/workflows/ci.yml | sed 's/.*"\(.*\)".*/\1/')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ZisK $v"

      # The scripts come from the default branch, never from the PR: otherwise
      # a PR could rewrite the script that renders its own verdict.
      - name: Checkout scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: trusted

      # Part of every cache key that depends on which blocks were sampled.
      - name: Hash the sampler
        id: sampler
        run: echo "hash=$(sha256sum trusted/.github/scripts/bench_sample.py | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Plan the shards
        id: shards
        run: |
          list=$(python3 -c "import json,os; n=int(os.environ['TIER_SHARDS']); print(json.dumps(['corpus']+[f'tier-{i}' for i in range(1,n+1)]))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  build:
    name: Build (${{ matrix.key }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: rv64im
            build_step: rv64im-object
            obj_file: zesu.o
          - key: zisk
            build_step: zisk-object
            obj_file: zesu-zisk.o

    steps:
      - name: Checkout zesu (PR head)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: head

      - name: Checkout zesu (merge-base)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: base

      - name: Checkout zesu-zkvm
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Consensys-Incorporated/zesu-zkvm
          ref: ${{ needs.prepare.outputs.zkvm }}
          path: zesu-zkvm

      - name: Checkout benchmark harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ env.SE_REPO }}
          ref: ${{ env.SE_REF }}
          path: harness

      - name: Checkout zisk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: 0xPolygonHermez/zisk
          ref: v${{ needs.prepare.outputs.zisk }}
          path: zisk

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: '0.16.0'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-zisk runtime deps
        run: sudo apt-get install -y libomp5 libopenmpi3t64

      - name: Install cargo-zisk
        env:
          ZISK_VERSION: ${{ needs.prepare.outputs.zisk }}
        run: |
          ZISK_BIN_DIR="${HOME}/.config/.zisk/bin"
          mkdir -p "$ZISK_BIN_DIR"
          curl -fsSL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup" \
            -o "$ZISK_BIN_DIR/ziskup"
          chmod +x "$ZISK_BIN_DIR/ziskup"
          # Pin the emulator to the same ZisK as the staticlib and linker script;
          # bare `ziskup` resolves "latest" and can silently outrun them.
          "$ZISK_BIN_DIR/ziskup" -v "$ZISK_VERSION" --cpu --nokey
          echo "$ZISK_BIN_DIR" >> $GITHUB_PATH
          "$ZISK_BIN_DIR/ziskemu" --version

      - name: Install Zisk Rust toolchain
        run: cargo +zisk --version 2>/dev/null || cargo-zisk toolchain install

      - name: Cache libziskos_staticlib.a
        id: cache-libziskos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zesu-zkvm/zisk/lib/libziskos_staticlib.a
          key: libziskos-staticlib-${{ needs.prepare.outputs.zisk }}-${{ runner.os }}

      - name: Build libziskos_staticlib.a
        if: steps.cache-libziskos.outputs.cache-hit != 'true'
        working-directory: zesu-zkvm/zisk
        run: make lib/libziskos_staticlib.a ZISK_DIR=$GITHUB_WORKSPACE/zisk

      # The merge-base ELF is identical for every PR sharing that base, so it is
      # usually a cache hit and only the PR head gets built. The key covers
      # everything that would make the two builds incomparable — base commit,
      # ZisK version, linker/host pin — so a stale hit cannot skew a comparison.
      - name: Cache merge-base ELF
        id: cache-base-elf
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: elf-base
          # Keyed by matrix.key too: rv64im-object and zisk-object are different
          # ELFs for the same base sha and must never share a cache entry.
          key: >-
            benchelf-${{ matrix.key }}-${{ needs.prepare.outputs.base }}-${{ needs.prepare.outputs.zisk }}-${{
            needs.prepare.outputs.zkvm }}-${{ runner.os }}

      - name: Build merge-base ELF
        id: base-elf
        if: steps.cache-base-elf.outputs.cache-hit != 'true'
        env:
          BUILD_STEP: ${{ matrix.build_step }}
          OBJ_FILE: ${{ matrix.obj_file }}
        run: |
          set -euo pipefail
          cd base
          # zig build -l writes to stderr; redirect so grep can see it.
          if zig build -l 2>&1 | grep -q "^  $BUILD_STEP "; then
            zig build "$BUILD_STEP" -Doptimize=ReleaseFast
            base_obj="zig-out/lib/$OBJ_FILE"
          elif [ "$BUILD_STEP" = "rv64im-object" ]; then
            # rv64im-object always exists; this branch shouldn't be reached.
            zig build rv64im-object -Doptimize=ReleaseFast
            base_obj=zig-out/lib/zesu.o
          else
            # merge-base predates this build step — no like-for-like baseline.
            # Linking the rv64im fallback through the HEAD zisk linker fails
            # because the ABI may have diverged; skip the comparison instead.
            echo "no_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd ..
          (cd zesu-zkvm/zisk && zig build -Doptimize=ReleaseFast \
            -Dzesu_obj="$GITHUB_WORKSPACE/base/$base_obj")
          cp zesu-zkvm/zisk/zig-out/bin/zesu-zisk elf-base

      - name: Build PR head ELF
        if: steps.base-elf.outputs.no_base != 'true'
        env:
          BUILD_STEP: ${{ matrix.build_step }}
          OBJ_FILE: ${{ matrix.obj_file }}
        run: |
          set -euo pipefail
          (cd head && zig build "$BUILD_STEP" -Doptimize=ReleaseFast)
          # Remove the previous link output: a failed build otherwise leaves a
          # stale ELF behind and the benchmark silently measures the old one.
          rm -f zesu-zkvm/zisk/zig-out/bin/zesu-zisk
          (cd zesu-zkvm/zisk && zig build -Doptimize=ReleaseFast \
            -Dzesu_obj="$GITHUB_WORKSPACE/head/zig-out/lib/$OBJ_FILE")
          cp zesu-zkvm/zisk/zig-out/bin/zesu-zisk elf-head
          ls -l elf-base elf-head

      - name: Build the harness
        if: steps.base-elf.outputs.no_base != 'true'
        working-directory: harness
        run: go build -o "$GITHUB_WORKSPACE/bench" ./bench

      # Detail pass: one extra execution per build (~10s each) buys the
      # per-opcode, FROPS, memory-by-type and per-function tables. `--save-stats`
      # then lets ziskemu diff the two snapshots itself, with no further run.
      # Uses the in-repo vector, which needs no SSZ encoding — so it says what
      # moved, while the corpus and tier say how much.
      - name: Detail pass
        if: steps.base-elf.outputs.no_base != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p detail
          vector=$(find zesu-zkvm/vectors -name '*.bin' | sort | head -1)
          test -n "$vector"
          for v in base head; do
            ziskemu -e "elf-$v" -i "$vector" -X -S --mem-stats \
              --save-stats "detail/snap-$v.csv" > "detail/report-$v.txt"
          done
          ziskemu --diff-stats detail/snap-base.csv detail/snap-head.csv --color never \
            > detail/opcode-diff.txt
          ziskemu --diff-stats detail/snap-base.csv detail/snap-head.csv \
            --html-report detail/bench-detail.html > /dev/null

      # A marker file rather than a job output: matrix jobs share one set of
      # outputs, so a per-variant flag has to travel with the variant's artifact.
      - name: Mark a missing baseline
        if: steps.base-elf.outputs.no_base == 'true'
        run: touch no-base

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.key }}
          path: |
            elf-base
            elf-head
            bench
            no-base
            detail/
          if-no-files-found: error
          retention-days: 1

  inputs:
    name: Inputs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: trusted

      - name: Fetch corpus blocks
        env:
          BLOCKS: ${{ needs.prepare.outputs.blocks }}
        run: |
          set -euo pipefail
          blocks="$BLOCKS"
          batches=$(( (blocks + CORPUS_BATCH_SIZE - 1) / CORPUS_BATCH_SIZE ))
          curl -fsSL "$CORPUS_URL/batches.jsonl" -o batches.jsonl
          mkdir -p corpus
          python3 - "$batches" <<'PY' > wanted.txt
          import json, os, sys
          want, start = int(sys.argv[1]), int(os.environ["CORPUS_START"])
          rows = [json.loads(l) for l in open("batches.jsonl") if l.strip()]
          rows = [r for r in rows if r["batchStartBlock"] >= start]
          rows.sort(key=lambda r: r["batchStartBlock"])
          for r in rows[:want]:
              print(r["path"], r["sha256"][2:])
          PY
          test -s wanted.txt
          while read -r path sha; do
            f="corpus/$(basename "$path")"
            curl -fsSL "$CORPUS_URL/$path" -o "$f"
            echo "$sha  $f" | sha256sum -c -
            tar --zstd -xf "$f" -C corpus
          done < wanted.txt
          # Keep the first N blocks, in block order (fixtures are named
          # <block>-<hash>.json), in a directory of their own: a batch holds
          # more blocks than were asked for, and the archives also carry
          # .meta/manifest.json, which is not a fixture. sed, not head: head
          # exits early, and sort's next write would then fail on SIGPIPE.
          mkdir -p inputs/corpus
          find corpus/blockchain_tests_engine -name '*.json' | sort | sed -n "1,${blocks}p" \
            | xargs -I{} cp {} inputs/corpus/
          ls inputs/corpus | wc -l

      # Only the sample is cached: it is a few MB against the tier's 156 MB
      # tarball, and it is fixed by the release and the sampler.
      - name: Cache gas-tier sample
        id: cache-tier
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tier-sample
          key: >-
            tier-${{ env.TIER_RELEASE }}-${{ env.TIER_DIR }}-${{ env.TIER_PER_FILE }}-${{
            needs.prepare.outputs.sampler }}

      - name: Fetch and sample the gas tier
        if: steps.cache-tier.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$TIER_RELEASE" | sed 's/@/%40/')
          tier=$(printf '%04dM' "${TIER%M}")
          curl -fsSL -o tier.tar.gz \
            "https://github.com/ethereum/execution-specs/releases/download/$tag/fixtures_zkevm-benchmark_$tier.tar.gz"
          mkdir -p tier-full
          tar -xzf tier.tar.gz -C tier-full
          python3 trusted/.github/scripts/bench_sample.py \
            "tier-full/fixtures/blockchain_tests/$TIER_DIR" tier-sample \
            --per-file "$TIER_PER_FILE"
          rm -rf tier-full tier.tar.gz

      # Round-robin over the sorted files, keeping each file's suite directory
      # so the harness's `suite` column matches an unsplit run.
      - name: Split the tier sample
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil
          n = int(os.environ["TIER_SHARDS"])
          files = sorted(
              os.path.relpath(os.path.join(d, f), "tier-sample")
              for d, _, fs in os.walk("tier-sample") for f in fs if f.endswith(".json"))
          for i, rel in enumerate(files):
              dst = os.path.join("inputs", f"tier-{i % n + 1}", rel)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copy(os.path.join("tier-sample", rel), dst)
          for s in range(n):
              print(f"tier-{s + 1}: {len(files[s::n])} block(s)")
          PY

      - name: Upload inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inputs
          path: inputs/
          if-no-files-found: error
          retention-days: 1

  run:
    name: Run (${{ matrix.key }}, ${{ matrix.shard }})
    needs: [prepare, build, inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A tier shard failing costs the tier table, not the whole comment.
    continue-on-error: ${{ matrix.shard != 'corpus' }}
    strategy:
      fail-fast: false
      matrix:
        key: [rv64im, zisk]
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}

    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-${{ matrix.key }}

      - name: Check for a baseline
        id: base
        run: |
          if [ -e no-base ]; then
            echo "No merge-base build for this variant; nothing to run."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download inputs
        if: steps.base.outputs.missing != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inputs
          path: inputs

      - name: Install ziskemu runtime deps
        if: steps.base.outputs.missing != 'true'
        run: sudo apt-get install -y libomp5 libopenmpi3t64

      - name: Install ziskemu
        if: steps.base.outputs.missing != 'true'
        env:
          ZISK_VERSION: ${{ needs.prepare.outputs.zisk }}
        run: |
          ZISK_BIN_DIR="${HOME}/.config/.zisk/bin"
          mkdir -p "$ZISK_BIN_DIR"
          curl -fsSL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup" \
            -o "$ZISK_BIN_DIR/ziskup"
          chmod +x "$ZISK_BIN_DIR/ziskup"
          "$ZISK_BIN_DIR/ziskup" -v "$ZISK_VERSION" --cpu --nokey
          echo "$ZISK_BIN_DIR" >> $GITHUB_PATH
          "$ZISK_BIN_DIR/ziskemu" --version

      # Trace costs are deterministic, so the merge-base's results are a pure
      # function of this key: every PR sharing a merge-base reuses them and runs
      # only its own head. The key covers everything the CSV depends on — the
      # ELF inputs, the harness, the blocks, the tier sample and its split.
      - name: Cache merge-base results
        id: cache-base-results
        if: steps.base.outputs.missing != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: base.csv
          key: >-
            benchres-${{ matrix.key }}-${{ matrix.shard }}-${{ needs.prepare.outputs.base }}-${{
            needs.prepare.outputs.zisk }}-${{ needs.prepare.outputs.zkvm }}-${{ runner.os }}-${{
            env.SE_REF }}-${{ env.CORPUS_START }}-${{ needs.prepare.outputs.blocks }}-${{
            env.TIER_RELEASE }}-${{ env.TIER_DIR }}-${{ env.TIER_PER_FILE }}-${{
            needs.prepare.outputs.sampler }}-${{ env.TIER_SHARDS }}

      # Base and head run side by side rather than one after the other: a
      # shard's wall time is set by its slowest block, and this pays it once.
      - name: Run benchmark
        if: steps.base.outputs.missing != 'true'
        env:
          CACHED: ${{ steps.cache-base-results.outputs.cache-hit }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Artifacts do not keep the executable bit.
          chmod +x bench elf-base elf-head
          pids=()
          for v in base head; do
            if [ "$v" = base ] && [ "$CACHED" = true ] && [ -s base.csv ]; then
              echo "base.csv restored from cache"; continue
            fi
            ./bench \
              --fixtures "inputs/$SHARD" \
              --elf "elf-$v" \
              --zkvmPath ziskemu \
              --jobs "$(nproc)" \
              --csv "$v.csv" > "$v.log" 2>&1 &
            pids+=("$!:$v")
          done
          rc=0
          for p in "${pids[@]}"; do
            v="${p#*:}"
            wait "${p%%:*}" || { echo "::error::$v run failed"; rc=1; }
            echo "::group::$v log"; cat "$v.log"; echo "::endgroup::"
          done
          exit $rc

      - name: Upload results
        if: steps.base.outputs.missing != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: csv-${{ matrix.key }}-${{ matrix.shard }}
          path: |
            base.csv
            head.csv
          if-no-files-found: error
          retention-days: 1

  report:
    name: Report (${{ matrix.key }})
    needs: [prepare, build, run]
    # Runs after a failed tier shard too: that only drops the tier table.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: rv64im
            label: "rv64im (zkvm-standards baseline)"
          - key: zisk
            label: "ZisK (rv64im + Zbb + Zbs)"

    steps:
      # The reporting script comes from the default branch, never from the PR:
      # otherwise a PR could rewrite the script that renders its own verdict.
      - name: Checkout reporting script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: trusted

      - name: Download binaries
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-${{ matrix.key }}
          path: bin

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: csv-${{ matrix.key }}-*
          path: csv

      # Joins the shards back into one CSV pair per section. The corpus is
      # required; the tier table is rendered only if every tier shard came back,
      # so a missing shard cannot quietly drop suites from it.
      - name: Collect results
        id: collect
        env:
          KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          if [ -e bin/no-base ]; then
            echo "no_base=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cp bin/detail/* . 2>/dev/null || true
          python3 - <<'PY'
          import csv, os, sys
          key, n = os.environ["KEY"], int(os.environ["TIER_SHARDS"])
          def shard(s, v):
              p = f"csv/csv-{key}-{s}/{v}.csv"
              return p if os.path.exists(p) and os.path.getsize(p) else None
          def join(paths, out):
              w = None
              with open(out, "w", newline="") as fh:
                  for p in paths:
                      with open(p, newline="") as src:
                          r = csv.DictReader(src)
                          if w is None:
                              w = csv.DictWriter(fh, fieldnames=r.fieldnames)
                              w.writeheader()
                          w.writerows(r)
          for v in ("base", "head"):
              p = shard("corpus", v)
              if not p:
                  sys.exit(f"::error::no corpus {v} results for {key}")
              join([p], f"{v}.csv")
          tiers = {v: [shard(f"tier-{i}", v) for i in range(1, n + 1)] for v in ("base", "head")}
          if all(all(ps) for ps in tiers.values()):
              for v, ps in tiers.items():
                  join(ps, f"tier-{v}.csv")
          else:
              print(f"::warning::a {key} tier shard is missing; the tier table is left out")
          PY

      # A run takes minutes, so the PR can move under it. Read the head again
      # here and let the comment say so, rather than silently presenting the
      # numbers as current.
      - name: Re-read the PR head
        id: now
        if: steps.collect.outputs.no_base != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.prepare.outputs.pr }}
        run: |
          cur=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha || true)
          echo "head=$cur" >> "$GITHUB_OUTPUT"

      - name: Render comparison
        id: diff
        if: steps.collect.outputs.no_base != 'true'
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          CURRENT_HEAD: ${{ steps.now.outputs.head }}
          OBJECT_LABEL: ${{ matrix.label }}
        run: |
          set +e
          detail=""
          [ -n "$CURRENT_HEAD" ] && detail="--current-head $CURRENT_HEAD"
          if [ -s tier-base.csv ] && [ -s tier-head.csv ]; then
            detail="$detail --tier-base tier-base.csv --tier-head tier-head.csv --tier-name $TIER"
          fi
          python3 trusted/.github/scripts/bench_diff.py \
            --base base.csv --head head.csv \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --corpus "$CORPUS" \
            --label "$OBJECT_LABEL" $detail > comment.md
          echo "status=$?" >> "$GITHUB_OUTPUT"

          # The run summary has a 1 MB budget against the comment's 64 KB, so
          # the full reports go here in full — rendered on the run page, with
          # no artifact download.
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          for v in base head; do
            [ -s "report-$v.txt" ] || continue
            {
              printf '\n<details><summary>Full %s report</summary>\n\n```\n' "$v"
              cat "report-$v.txt"
              printf '```\n\n</details>\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Post no-baseline notice
        if: steps.collect.outputs.no_base == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.prepare.outputs.pr }}
          MATRIX_KEY: ${{ matrix.key }}
          MATRIX_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          marker="<!-- zesu-benchmark:$MATRIX_KEY -->"
          body="### Benchmark — $MATRIX_LABEL"$'\n\n'
          body+="No baseline available: the merge-base predates the \`$MATRIX_KEY\` build step, "
          body+="so a like-for-like comparison cannot be produced."$'\n'
          body+="$marker"
          gh api "repos/$REPO/issues/$PR/comments" -f body="$body" --silent

      - name: Post result
        if: steps.diff.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.prepare.outputs.pr }}
          MATRIX_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          # Always a new comment, one per variant per run, so earlier results
          # stay on the PR for comparison (delete old ones if it gets noisy).
          # The marker only identifies these as benchmark comments.
          marker="<!-- zesu-benchmark:$MATRIX_KEY -->"
          printf '%s\n' "$marker" >> comment.md
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -F body=@comment.md --silent

      # Marks the PR as having benchmark data, so `label:benchmarked` works as a
      # filter. Deliberately not a verdict — ten blocks is a smoke signal, and a
      # durable `improved`/`regressed` label would overstate it. Freshness is
      # the comment's job, via its stale note.
      #
      # Never fails the run: a labelling hiccup should not discard the results.
      - name: Label the PR
        if: always() && steps.diff.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.prepare.outputs.pr }}
        run: |
          # Create-then-add, because adding an unknown label is not reliably
          # self-creating. Both calls are idempotent.
          gh api -X POST "repos/$REPO/labels" \
            -f name=benchmarked \
            -f color=1d76db \
            -f description="Guest benchmark has been run on this PR" \
            --silent 2>/dev/null || true
          gh api -X POST "repos/$REPO/issues/$PR/labels" \
            -f "labels[]=benchmarked" --silent || true

      # The comment is a summary; these hold the full per-opcode, memory and
      # per-function tables for anyone digging into a surprising number.
      - name: Upload full reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ needs.prepare.outputs.pr }}-${{ needs.prepare.outputs.head }}-${{ matrix.key }}
          path: |
            base.csv
            head.csv
            tier-base.csv
            tier-head.csv
            report-base.txt
            report-head.txt
            snap-base.csv
            snap-head.csv
            opcode-diff.txt
            bench-detail.html
          if-no-files-found: warn

      # Perf movement never fails the run; a wrong payload root or a block that
      # did not execute does, so a broken PR cannot read as a clean benchmark.
      - name: Fail on correctness divergence
        if: steps.diff.outcome == 'success' && steps.diff.outputs.status != '0'
        run: |
          echo "Benchmark found a correctness divergence — see the PR comment."
          exit 1

  # Swaps the 👀 on the request for 🚀 when every comment was posted cleanly,
  # or 😕 when a report failed, so the outcome shows on the request itself.
  # Skipped on cancellation: a newer /benchmark superseded this one.
  finish:
    name: Finish
    needs: [prepare, report]
    if: >
      !cancelled() && inputs.comment_id != '' &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: React with the outcome
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ inputs.comment_id }}
          RESULT: ${{ needs.report.result }}
        run: |
          case "$COMMENT_ID" in ''|*[!0-9]*) echo "bad comment id"; exit 1 ;; esac
          url="repos/$REPO/issues/comments/$COMMENT_ID/reactions"
          for id in $(gh api "$url" \
              --jq '.[] | select(.content == "eyes" and .user.login == "github-actions[bot]") | .id'); do
            gh api -X DELETE "$url/$id" --silent || true
          done
          if [ "$RESULT" = success ]; then content=rocket; else content=confused; fi
          gh api -X POST "$url" -f content="$content" --silent
